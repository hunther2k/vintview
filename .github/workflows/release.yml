name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check version
        run: |
          V=$(grep '^version=' version.properties | cut -d= -f2 | tr -d '\r')
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version.properties ($V)"; exit 1
          fi
          echo "V=$V" >> "$GITHUB_ENV"

      - name: Signing key
        run: echo "${{ secrets.VV_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        env:
          VV_KEYSTORE: ${{ runner.temp }}/release.jks
          VV_KEYSTORE_PASSWORD: ${{ secrets.VV_KEYSTORE_PASSWORD }}
          VV_KEY_ALIAS: vintview
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/vintview-$V-release.apk
          "$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "$APK" | grep -i "CN=Hunther2K"
          cp "$APK" "vintview-$V.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force --tags
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > notes.txt
          [ -s notes.txt ] || git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.txt
          gh release create "$GITHUB_REF_NAME" "vintview-$V.apk" --title "Vintview $V" --notes-file notes.txt
